<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>SR Weekend Map</title>
  <meta name="description" content="SR Weekend map. Sheraton Denver Downtown and the places that matter this weekend, Nov 13 to 15, 2026.">
  <meta name="theme-color" content="#F4F2E6">
  <link rel="icon" href="assets/sr-mark.svg" type="image/svg+xml">
  <link rel="preload" href="fonts/bricolage-grotesque-latin-800-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/instrument-sans-latin-500-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="vendor/leaflet.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app" id="app">
    <div class="map" id="map" aria-label="SR Weekend map of Denver"></div>

    <a class="brand" id="brand" href="./">
      <img src="assets/sr-mark.svg" alt="" width="24" height="32">
      <span class="brand-t">
        <b id="brandName">SR Weekend</b>
        <span id="brandSub">Denver, Nov 13 to 15</span>
      </span>
      <svg class="brand-cactus" viewBox="0 0 30 46" aria-hidden="true"><path d="M10 44V9a5 5 0 0 1 10 0v35M10 29H6a3 3 0 0 1-3-3v-8M20 23h4a3 3 0 0 0 3-3v-8M2 44.5h26"/></svg>
    </a>

    <div class="ctrl" id="ctrl">
      <button type="button" id="zin" aria-label="Zoom in"><svg viewBox="0 0 24 24"><path d="M12 6v12M6 12h12"/></svg></button>
      <button type="button" id="zout" aria-label="Zoom out"><svg viewBox="0 0 24 24"><path d="M6 12h12"/></svg></button>
      <button type="button" id="home" aria-label="Back to the Sheraton"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="6.5"/><path d="M12 2.5v3.5M12 18v3.5M2.5 12H6M18 12h3.5"/></svg></button>
    </div>

    <div class="foot" id="foot"><span class="ref-tag" id="refTag">Design reference</span></div>

    <aside class="card" id="card" hidden aria-live="polite">
      <div class="grab" id="grab" aria-hidden="true"><span></span></div>
      <button class="close" id="close" type="button" aria-label="Close">
        <svg viewBox="0 0 24 24"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/></svg>
      </button>
      <div class="card-scroll" id="cardScroll"><div class="card-body" id="cardBody"></div></div>
    </aside>
  </div>

  <script src="vendor/leaflet.js"></script>
  <script src="data/geo.js"></script>
  <script src="locations.js"></script>
  <script src="app.js"></script>
</body>
</html>
