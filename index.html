<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>SR Weekend Map, design reference</title>
  <meta name="description" content="Design and UX reference for the SR Weekend map. Sheraton Denver Downtown, Nov 13 to 15, 2026.">
  <meta name="theme-color" content="#F4F2E6">
  <link rel="icon" href="assets/sr-mark.svg" type="image/svg+xml">
  <link rel="preload" href="fonts/bricolage-grotesque-latin-800-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/instrument-sans-latin-500-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app" id="app">
    <header class="bar">
      <a class="brand" href="./" aria-label="SR Weekend map home">
        <img class="brand-mark" src="assets/sr-mark.svg" alt="" width="22" height="29">
        <span class="brand-text">
          <span class="brand-name" id="brandName">SR Weekend</span>
          <span class="brand-sub" id="brandSub">Sheraton Denver Downtown</span>
        </span>
      </a>
      <div class="seg" id="seg" hidden role="tablist" aria-label="Map view">
        <button role="tab" data-view="hotel" aria-selected="true">Hotel</button>
        <button role="tab" data-view="denver" aria-selected="false">Denver</button>
      </div>
      <button class="help-btn" id="helpBtn" type="button">
        <span class="help-dot" aria-hidden="true"></span>Super Steve
      </button>
    </header>

    <main class="main">
      <section class="map-col" aria-label="Map">
        <div class="stage-wrap" id="stageWrap">
          <div class="stage" id="stage">
            <svg class="base" id="base" viewBox="0 0 390 686" aria-hidden="true"></svg>
            <div class="overlay" id="overlay"></div>
          </div>
        </div>
        <div class="hint" id="hint"><span>Tap a spot for details.</span><span class="ref-tag" id="refTag">Design reference</span></div>
      </section>

      <aside class="panel" id="panel" aria-live="polite">
        <div class="panel-empty" id="panelEmpty"></div>
        <article class="card" id="card" hidden>
          <div class="grab" id="grab" aria-hidden="true"><span></span></div>
          <button class="close" id="close" type="button" aria-label="Close">
            <svg viewBox="0 0 24 24" width="18" height="18"><path d="M6 6l12 12M18 6L6 18" /></svg>
          </button>
          <div class="card-body" id="cardBody"></div>
        </article>
      </aside>
    </main>
  </div>

  <script src="locations.js"></script>
  <script src="app.js"></script>
</body>
</html>
